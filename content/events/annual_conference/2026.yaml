# Source: Colin Smith, SAGP 2026 Annual Conference (1).pdf, received 2026-10-08.
# Colin Smith’s accompanying email confirms Mitsis’s presentation and full institution names.
event:
  id: annual-conference-2026
  title: SAGP Annual Conference 2026
  subtitle: Empedocles, Plato, Aristotle, and Hellenistic and Roman philosophy.
  type: annual_conference
  status: upcoming
  description: >-
    The Society for Ancient Greek Philosophy’s 2026 Annual Conference takes place on Zoom on
    November 14–15, with four sessions on Empedocles and the Derveni Papyrus, Plato on tyranny,
    deliberation and contingency in Aristotle’s philosophy, and Hellenistic and Roman philosophy.
