# SAGP Call Schema
#
# A Call is an actionable Society announcement with one or more deadlines.

call:
  id:
  title:
  type:
  status:
  # Optional: false keeps an active call out of the homepage feature box.
  homepage_feature:
  url:

  summary:

  dates:
    posted:
    closes:

  deadlines:
    - label:
      date:
      note:

  eligibility:
    - text:

  submission:
    contact:
      name:
      email:

    instructions:
      - text:

    attachment:
      formats:
      blind_review:
      max_words:
      # Optional replacement for paper-length wording (e.g. an abstract word range).
      length_text:
      min_words_note:

  related:
    organizations:
      - name:
    event_series:
      - name:
